services:
  # Development services
  postgres:
    image: postgres:16.3
    ports:
      - "7090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: studium
      POSTGRES_PASSWORD: "Qv2A0Y1fNuncjHNL9U4gTb-IFPBmcY00"
    volumes:
      - studium_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "7091:6379"
    command: redis-server --requirepass "H18MVTAPb7EgIGAkCtq9wjMMrqMxXm-c"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: postgres:16.3
    ports:
      - "7092:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: studium_test
      POSTGRES_PASSWORD: "2VtFL9kLQGkde1x64o9-L4XSfaKq8KPp"
    volumes:
      - studium_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "7093:6379"
    command: redis-server --requirepass "2o0WWhpyfaxcOLzmz3LxylT7UU8VSn-Q"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  studium_data:
  studium_test_data:
