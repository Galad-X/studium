class: PaymentTransaction
table: payment_transactions
fields:
  subscriptionId: int, relation(parent=subscriptions) # Links to Subscription
  userId: int, relation(parent=serverpod_user_info) # Links to User
  amount: double
  status: String # e.g., 'success', 'failed', 'pending'
  gateway: String # 'stripe' or 'paystack'
  transactionId: String # External transaction ID
  createdAt: DateTime