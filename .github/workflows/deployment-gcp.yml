name: Deploy to GCP
on:
  push:
    branches: [ deployment-gcp-production, deployment-gcp-staging ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target'
        required: true
        default: 'production'
        type: choice
        options:
          - 'staging'
          - 'production'

env:
  # Configure deployment values as repository/environment variables rather
  # than committing project-specific settings.
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ZONE: ${{ vars.GCP_ZONE || 'us-central1-c' }}

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$PROJECT" || { echo "Missing repository variable GCP_PROJECT_ID"; exit 1; }
          case "$PROJECT" in
            *'<'*|*'>'*) echo "GCP_PROJECT_ID contains a placeholder"; exit 1 ;;
          esac

      - name: Setting Target Mode from Input
        if: ${{ github.event.inputs.target != '' }}
        run: echo "TARGET=${{ github.event.inputs.target }}" >> $GITHUB_ENV

      - name: Setting Target mode based on branch
        if: ${{ github.event.inputs.target == '' }}
        run: echo "TARGET=${GITHUB_REF##*-}" >> $GITHUB_ENV

      - name: Set repository
        run: echo "REPOSITORY=serverpod-${{ env.TARGET }}-container" >> $GITHUB_ENV

      - name: Set Image Name
        run: echo "IMAGE_NAME=serverpod" >> $GITHUB_ENV

      - name: Set Service Name
        run: echo "SERVICE_NAME=$(echo $IMAGE_NAME | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_ENV

      - name: Test
        run: echo $SERVICE_NAME


      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GOOGLE_CREDENTIALS }}"

      - name: Configure Docker
        working-directory: studium_server
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build the Docker image
        working-directory: studium_server
        run: "docker build -t $IMAGE_NAME ."

      - name: Tag the Docker image
        working-directory: studium_server
        run: docker tag $IMAGE_NAME ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPOSITORY }}/$IMAGE_NAME

      - name: Push Docker image
        working-directory: studium_server
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPOSITORY }}/$IMAGE_NAME

      - name: Deploy API, Insights, and scheduled worker job
        if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
        working-directory: studium_server
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT }}
          GCP_REGION: ${{ env.REGION }}
          GCP_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          GCP_DATABASE_INSTANCE: ${{ vars.GCP_DATABASE_INSTANCE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_WORKER_INVOKER_SERVICE_ACCOUNT: ${{ secrets.GCP_WORKER_INVOKER_SERVICE_ACCOUNT }}
          GCP_NOTIFICATION_CHANNEL: ${{ secrets.GCP_NOTIFICATION_CHANNEL }}
          GCP_PASSWORDS_SECRET: ${{ vars.GCP_PASSWORDS_SECRET_NAME }}
          GCP_RUNMODE: ${{ env.TARGET }}
        run: bash deploy/gcp/deploy-cloud-run.sh

      - name: Configure backend metrics, alerts, and dashboard
        if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
        working-directory: studium_server
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT }}
          GCP_NOTIFICATION_CHANNEL: ${{ secrets.GCP_NOTIFICATION_CHANNEL }}
        run: bash deploy/gcp/configure-observability.sh

      # Uncomment the following code to automatically restart the servers in the
      # instance group when you push a new version of your code. Before doing
      # this, make sure that you have successfully deployed a first version.
      #
      # - name: Restart servers in instance group
      #   run: |
      #     gcloud compute instance-groups managed rolling-action replace serverpod-${{ env.TARGET }}-group \
      #      --project=${{ env.PROJECT }} \
      #      --replacement-method='substitute' \
      #      --max-surge=1 \
      #      --max-unavailable=1 \
      #      --zone=${{ env.ZONE }}
